
name: CI/CD Pipeline with SonarQube, Nexus and Tomcat

on:
  push:
    branches:
      - master

jobs:

  build-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source
        uses: actions/checkout@v5


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Validate
      - name: Validate
        run: mvn validate


      # 4. Compile
      - name: Compile
        run: mvn compile


      # 5. Test
      - name: Test
        run: mvn test


      # 6. Package WAR
      - name: Package
        run: mvn package


      # 7. Verify WAR File
      - name: Verify the WAR file
        run: ls -lh target/


      # 8. SonarQube Scan
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=train \
            -Dsonar.projectName=TrainBook \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"


      # 9. Configure Maven settings.xml for Nexus
      - name: Configure Maven settings.xml for Nexus
        run: |
          mkdir -p ~/.m2

          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${{ secrets.NEXUS_USERNAME }}</username>
                <password>${{ secrets.NEXUS_PASSWORD }}</password>
              </server>
            </servers>
          </settings>
          EOF


      # 10. Upload WAR to Nexus
      - name: Upload WAR to Nexus
        run: |
          mvn deploy \
            -DaltDeploymentRepository=nexus::default::${{ secrets.NEXUS_REPO_URL }}


      # 11. Deploy WAR to Tomcat DEV
      - name: Deploy WAR to Tomcat DEV
        run: |
          curl -v \
            -u "${{ secrets.TOMCAT_USER }}:${{ secrets.TOMCAT_PASSWORD }}" \
            --upload-file target/TrainBook-1.0.0-SNAPSHOT.war \
            "http://${{ secrets.TOMCAT_HOST }}:8080/manager/text/deploy?path=/TrainBook&update=true"



